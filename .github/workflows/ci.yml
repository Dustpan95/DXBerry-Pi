  graywolf-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified Graywolf release for isolated testing
        run: bash tests/integration/download-graywolf.sh "$RUNNER_TEMP/graywolf-api"
      - name: Build the API test container
        run: docker build -t dxberry-graywolf-api -f tests/integration/Dockerfile tests/integration
      - name: Test the released API without network or radio devices
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/graywolf-api/extracted:/graywolf:ro" \
            -e GRAYWOLF_TEST_BIN=/graywolf/usr/bin/graywolf \
            dxberry-graywolf-api bash tests/integration/graywolf-api.sh
  pat-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web proxy test container
        run: docker build -t dxberry-webproxy -f tests/integration/Dockerfile.webproxy tests/integration
      - name: Test Pat routing and authentication without network or radio devices
        run: docker run --rm --network none -v "$PWD:/repo:ro" dxberry-webproxy
  pat-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Pat application and compilation images
        run: |
          docker build -t dxberry-pat-application -f tests/integration/Dockerfile.pat-application tests/integration
          docker pull golang:1.24.4-bookworm
      - name: Stage checksum-pinned official Pat package
        run: |
          mkdir -p "$RUNNER_TEMP/pat-package"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/pat-package:/evidence" \
            dxberry-pat-application bash tests/integration/download-pat.sh /evidence
      - name: Exercise actual idle application without network or radio devices
        run: |
          set -o pipefail
          DXB_PAT_RUN_IMAGE=dxberry-pat-application \
            bash tests/integration/test-pat-application.sh \
              "$RUNNER_TEMP/pat-package/pat_1.0.1_linux_amd64.deb" "$RUNNER_TEMP/pat-application" \
            | tee "$RUNNER_TEMP/pat-application.log"
          tee -a "$RUNNER_TEMP/pat-application.log" < "$RUNNER_TEMP/pat-application/pat-application.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pat-application-evidence
          path: |
            ${{ runner.temp }}/pat-application/
            ${{ runner.temp }}/pat-application.log
          if-no-files-found: warn
          retention-days: 7
  browser-ptt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the isolated browser station
        run: docker build -t dxberry-browser -f tests/integration/Dockerfile.browser .
      - name: Exercise real browser audio and PTT without network or radio devices
        run: docker run --rm --network none --shm-size=256m dxberry-browser
      - name: Exercise read-only native program status and recovery states
        run: docker run --rm --network none --shm-size=256m dxberry-browser bash tests/integration/browser-wsjtx.sh
  station:
    runs-on: ubuntu-latest
    env:
      # hraban/opus without its libopusfile part, as station/build.sh builds it (go vet,
      # staticcheck and go test read GOFLAGS)
      GOFLAGS: -tags=nolibopusfile
    defaults:
      run:
        working-directory: station
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopus-dev pkg-config
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go test
        run: go test -race ./...
  binary-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      GOFLAGS: -tags=nolibopusfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopus-dev pkg-config
      - name: go vet
        run: cd station && go vet ./...
      - name: go test
        run: cd station && go test -race ./...
      - name: Select unpublished candidate version
        run: echo "DXB_CANDIDATE_VERSION=$(cat provision/VERSION)-ci.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"
      - name: Build dxberryd
        run: bash station/build.sh out/dxberryd "$DXB_CANDIDATE_VERSION"
      - name: Cross-user WSJT-X settings bridge
        run: tests/integration/test-wsjtx-settings-bridge.sh
      - name: Prepare preset HTTP test images
        run: docker pull golang:1.24.4-bookworm && docker pull debian:trixie-slim
      - name: Prepare program generation runtime
        run: docker build -t dxberry-program-state-runtime:fixture -f tests/integration/Dockerfile tests/integration
      - name: Program generation helper process boundary
        run: DXB_PROGRAMSTATE_GOPATH="$(go env GOPATH)" tests/integration/test-program-state-cli.sh station/out/dxberry-program-state "$RUNNER_TEMP/program-state-cli"
      - name: Preset configuration HTTP and actual helper
        run: DXB_PRESET_GOPATH="$(go env GOPATH)" tests/integration/test-preset-http.sh station/out/dxberry-preset "$RUNNER_TEMP/preset-http"
      - name: Preset preview with root-owned isolated fixtures
        run: DXB_PRESET_GOPATH="$(go env GOPATH)" tests/integration/test-preset-preview.sh "$RUNNER_TEMP/preset-preview"
      - name: Show the binary
        # the Pi installs libopus0 only: a binary that needs libopusfile would not start there
        run: |
          file station/out/dxberryd
          file station/out/dxberry-wsjtx-settings
          file station/out/dxberry-preset
          file station/out/dxberry-program-state
          test "$(station/out/dxberryd -wsjtx-protocol)" = "$(cat provision/share/wsjtx-native-protocol)"
          libs=$(ldd station/out/dxberryd)
          echo "$libs"
          ! grep -q libopusfile <<< "$libs"
      - name: Package and verify unpublished ARM64 update candidate
        run: |
          for binary in dxberryd dxberry-wsjtx-settings dxberry-preset dxberry-program-state; do
            install -m 755 "station/out/$binary" "provision/bin/$binary"
          done
          build/build-image.sh --check
          out="$RUNNER_TEMP/update-candidate"
          archive=$(build/make-update-tarball.sh "$DXB_CANDIDATE_VERSION" "$out")
          (cd "$out" && sha256sum -c "$(basename "$archive").sha256")
          for binary in dxberryd dxberry-wsjtx-settings dxberry-preset dxberry-program-state; do
            tar -xOzf "$archive" "dxberry/bin/$binary" | cmp - "station/out/$binary"
          done
          test "$(tar -xOzf "$archive" dxberry/VERSION)" = "$(station/out/dxberryd -version)"
          git rev-parse HEAD > "$out/SOURCE_COMMIT"
          git rev-parse 'HEAD^{tree}' > "$out/SOURCE_TREE"
          (cd station/out && sha256sum dxberryd dxberry-wsjtx-settings dxberry-preset dxberry-program-state) > "$out/BINARY_SHA256SUMS"
          jq -cn --arg version "$DXB_CANDIDATE_VERSION" \
            --arg commit "$(cat "$out/SOURCE_COMMIT")" --arg tree "$(cat "$out/SOURCE_TREE")" \
            --arg archive "$(basename "$archive")" --arg sha256 "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
            '{kind:"unpublished-update-candidate",version:$version,source_commit:$commit,source_tree:$tree,archive:$archive,sha256:$sha256,architecture:"arm64",pi_installed:false,hardware_acceptance:false}' \
            | tee "$out/candidate.json"
      - name: Start and restart actual update candidate without hardware
        run: |
          archives=("$RUNNER_TEMP/update-candidate/"*.tar.gz)
          test "${#archives[@]}" = 1
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt=no-new-privileges --pids-limit=256 --memory=512m \
            --tmpfs /opt/dxberry:rw,nosuid,nodev,exec,size=128m,mode=755 \
            --tmpfs /var/lib/dxberry:rw,nosuid,nodev,noexec,size=8m,mode=700 \
            --tmpfs /run/dxberry:rw,nosuid,nodev,noexec,size=8m,mode=755 \
            --tmpfs /etc/dxberry:rw,nosuid,nodev,noexec,size=1m,mode=700 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 \
            -v "${archives[0]}:/fixture/update.tar.gz:ro" \
            -v "$PWD/tests/integration/update-candidate.sh:/fixture/check:ro" \
            -e DXB_UPDATE_CANDIDATE_FIXTURE=1 \
            dxberry-program-state-runtime:fixture bash /fixture/check \
            | tee "$RUNNER_TEMP/update-candidate/startup-check.log"
      - uses: actions/upload-artifact@v4
        with:
          name: dxberry-update-candidate
          path: ${{ runner.temp }}/update-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dxberryd-arm64
          path: |
            station/out/dxberryd
            station/out/dxberry-wsjtx-settings
            station/out/dxberry-preset
            station/out/dxberry-program-state
          if-no-files-found: error
          retention-days: 7

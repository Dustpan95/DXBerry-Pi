            -v "$RUNNER_TEMP/wsjtx-manager-evidence:/evidence" dxberry-wsjtx-manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsjtx-manager-evidence
          path: |
            ${{ runner.temp }}/wsjtx-manager-build.log
            ${{ runner.temp }}/wsjtx-manager-evidence

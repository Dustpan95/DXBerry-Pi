name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real station config in the tree
        run: '! git ls-files | grep -qxE "boot/dxberry\.txt|boot/dietpi-wifi\.txt"'
      - name: No attribution lines committed
        run: |
          if git grep -qIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . ; then
            echo "attribution text found in a tracked file:" >&2
            git grep -nIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . >&2
            exit 1
          fi
      - name: Syntax
        run: |
          for f in provision/bin/* provision/lib/*.sh provision/lib/apps/*.sh build/*.sh boot/*.sh tests/*.sh tests/fixtures/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x provision/bin/* provision/lib/*.sh provision/lib/apps/*.sh build/build-image.sh build/make-update-tarball.sh boot/*.sh tests/*.sh tests/fixtures/*.sh
      - name: Unit tests
        run: tests/run.sh
      - name: Build tree check
        run: build/build-image.sh --check
  station:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: station
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: station/go.mod
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go test
        run: go test -race ./...

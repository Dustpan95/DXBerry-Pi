            2>&1 | tee "$RUNNER_TEMP/wsjtx-manager-build.log"
      - name: Exercise actual start and stop guards without host privileges or radio devices
        run: |
          mkdir -p "$RUNNER_TEMP/wsjtx-manager-evidence"

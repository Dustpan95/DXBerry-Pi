name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  superseded-runs:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref || context.ref.replace(/^refs\/heads\//, '');
            const head = context.payload.pull_request?.head.sha || context.sha;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', branch, per_page: 100
            });
            for (const run of runs) {
              if (run.id !== context.runId && run.head_sha !== head &&
                  ['queued', 'in_progress'].includes(run.status)) {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                core.info(`Cancelled superseded CI run ${run.id}`);
              }
            }
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build disposable root-fixture runner
        run: docker build -t dxberry-shell-ci -f tests/integration/Dockerfile.shell .
      - name: Syntax, lint, root fixtures and packaging checks
        run: |
          set -o pipefail
          docker run --rm --network none -v "$PWD:/source:ro" dxberry-shell-ci \
            | tee "$RUNNER_TEMP/shell-ci.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-ci-evidence
          path: ${{ runner.temp }}/shell-ci.log
          if-no-files-found: warn
          retention-days: 7
  systemd-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated systemd guest
        run: docker build -t dxberry-systemd-ci -f tests/integration/systemd/Dockerfile .
      - name: Exercise real manager delivery without host privileges or radio devices
        run: |
          mkdir -p "$RUNNER_TEMP/systemd-evidence"
          docker run --rm --network none --cap-drop ALL --read-only \
            --user "$(id -u):$(id -g)" --memory=3g \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$RUNNER_TEMP/systemd-evidence:/evidence" dxberry-systemd-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-queue-evidence
          path: ${{ runner.temp }}/systemd-evidence
          if-no-files-found: warn
          retention-days: 7
  pat-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated actual Pat systemd guest
        run: docker build -t dxberry-pat-manager -f tests/integration/pat-manager/Dockerfile .
      - name: Exercise actual managed reader without host privileges or radio devices
        run: |
          mkdir -p "$RUNNER_TEMP/pat-manager-evidence"
          docker run --rm --network none --cap-drop ALL --read-only \
            --security-opt=no-new-privileges --pids-limit=128 \
            --user "$(id -u):$(id -g)" --memory=3g \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$RUNNER_TEMP/pat-manager-evidence:/evidence" dxberry-pat-manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pat-manager-evidence
          path: ${{ runner.temp }}/pat-manager-evidence
          if-no-files-found: warn
          retention-days: 7
  wsjtx-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build checksum-pinned official WSJT-X fixture
        run: |
          set -o pipefail
          docker build -t dxberry-wsjtx-application -f tests/integration/wsjtx-application/Dockerfile . \
            2>&1 | tee "$RUNNER_TEMP/wsjtx-application-build.log"
      - name: Observe actual idle profiles without network or radio devices
        run: |
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --read-only \
            --security-opt=no-new-privileges --pids-limit=256 --memory=2g \
            --user 65534:65534 --shm-size=128m \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            dxberry-wsjtx-application -test.v -test.timeout=450s -test.count=3 \
            -test.run='^TestWSJTXApplicationCompatibility$' | tee "$RUNNER_TEMP/wsjtx-application.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wsjtx-application-evidence
          path: |
            ${{ runner.temp }}/wsjtx-application-build.log
            ${{ runner.temp }}/wsjtx-application.log
          if-no-files-found: warn
          retention-days: 7

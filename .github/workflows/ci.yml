name: Graywolf capture recovery validation
on:
  push:
    branches: [validation/graywolf-audio-4978244]
permissions:
  contents: read

jobs:
  soundcard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: fixture
          sparse-checkout: tests/integration/graywolf-capture
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: upstream
          repository: chrissnell/graywolf
          ref: 4978244d2ea61bf5635e882ad650c46f873bd9ca
          persist-credentials: false
      - name: Build the pinned upstream audio tests on ARM64
        run: |
          set -euo pipefail
          cd upstream
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD^{tree})" = 83781b3498cfb0dc7ff8fa6ed91935f0607de922
          cp ../fixture/tests/integration/graywolf-capture/pcm.rs graywolf-modem/tests/station_pcm.rs
          docker build -t graywolf-audio-tests -f - . <<'DOCKERFILE'
          FROM rust:1-bookworm AS build
          RUN apt-get update && apt-get install -y --no-install-recommends libasound2-dev libudev-dev protobuf-compiler jq && rm -rf /var/lib/apt/lists/*
          WORKDIR /src
          COPY . .
          RUN rustc -Vv && cargo test --locked --package graywolf-demod --lib --test station_pcm --no-run --message-format=json > /tmp/build.json && \
              cp "$(jq -ers '[.[] | select(.reason=="compiler-artifact" and .target.name=="graywolfmodem" and .profile.test and .executable!=null) | .executable] | select(length==1) | .[0]' /tmp/build.json)" /audio-tests && \
              cp "$(jq -ers '[.[] | select(.reason=="compiler-artifact" and .target.name=="station_pcm" and .profile.test and .executable!=null) | .executable] | select(length==1) | .[0]' /tmp/build.json)" /pcm-tests
          RUN GRAYWOLF_GIT_COMMIT=4978244d cargo build --locked --release --bin graywolf-modem
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends libasound2 libudev1 && rm -rf /var/lib/apt/lists/*
          RUN printf '%s\n' 'pcm.!default { type null }' 'pcm.dxb_fixture { type null hint { show on description "DXBerry synthetic PCM" } }' > /etc/asound.conf
          COPY --from=build /audio-tests /audio-tests
          COPY --from=build /src/target/release/graywolf-modem /candidate/graywolf-modem
          COPY --from=build /pcm-tests /pcm-tests
          ENTRYPOINT ["/audio-tests"]
          DOCKERFILE
      - name: Run the upstream soundcard tests without devices or network
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --cap-drop ALL --user 65534:65534 \
            --security-opt no-new-privileges graywolf-audio-tests \
            'audio::soundcard::tests::' --test-threads=1 | tee "$RUNNER_TEMP/audio-tests.log"
          for name in stream_error_policy_tolerates_isolated_xruns stream_error_policy_escalates_xrun_burst \
            stream_error_policy_non_xrun_is_always_fatal alsa_alias_matches_canonicalizes_shorthand \
            output_state_survives_rebuild_sharing_receiver; do
            grep -Fx "test audio::soundcard::tests::$name ... ok" "$RUNNER_TEMP/audio-tests.log"
          done
      - name: Reopen a named synthetic input through the modem
        run: |
          set -euo pipefail
          timeout 30s docker run --rm --read-only --network none --cap-drop ALL --user 65534:65534 \
            --security-opt no-new-privileges --entrypoint /pcm-tests graywolf-audio-tests \
            --exact named_pcm_reopens_and_delivers_input | tee "$RUNNER_TEMP/named-pcm.log"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/named-pcm.log"
      - name: Rehearse the modem trial and automatic rollback with the packaged service
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/modem-rehearsal"
          mkdir -p "$stage"
          container=$(docker create graywolf-audio-tests)
          docker cp "$container:/candidate/graywolf-modem" "$stage/graywolf-modem"
          docker rm "$container"
          curl -fsSL --retry 2 --max-time 90 -o "$stage/graywolf.deb" https://github.com/chrissnell/graywolf/releases/download/v0.14.14/graywolf_0.14.14_arm64.deb
          sudo env GITHUB_ACTIONS=true bash fixture/tests/integration/graywolf-capture/rehearse.sh "$stage/graywolf-modem" "$stage/graywolf.deb"
          cd "$stage"
          sha256sum graywolf-modem > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: graywolf-modem-4978244d-arm64
          path: |
            ${{ runner.temp }}/modem-rehearsal/graywolf-modem
            ${{ runner.temp }}/modem-rehearsal/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

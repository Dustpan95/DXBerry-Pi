name: Graywolf capture recovery validation
on:
  push:
    branches: [validation/graywolf-audio-4978244]
permissions:
  contents: read

jobs:
  soundcard:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chrissnell/graywolf
          ref: 4978244d2ea61bf5635e882ad650c46f873bd9ca
          persist-credentials: false
      - name: Build the pinned upstream audio tests on ARM64
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git rev-parse HEAD^{tree})" = 83781b3498cfb0dc7ff8fa6ed91935f0607de922
          docker build -t graywolf-audio-tests -f - . <<'DOCKERFILE'
          FROM rust:1-bookworm AS build
          RUN apt-get update && apt-get install -y --no-install-recommends libasound2-dev libudev-dev protobuf-compiler jq && rm -rf /var/lib/apt/lists/*
          WORKDIR /src
          COPY . .
          RUN rustc -Vv && cargo test --locked --package graywolf-demod --lib --no-run --message-format=json > /tmp/build.json && \
              cp "$(jq -ers '[.[] | select(.reason=="compiler-artifact" and .target.name=="graywolfmodem" and .profile.test and .executable!=null) | .executable] | select(length==1) | .[0]' /tmp/build.json)" /audio-tests
          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends libasound2 libudev1 && rm -rf /var/lib/apt/lists/*
          COPY --from=build /audio-tests /audio-tests
          ENTRYPOINT ["/audio-tests"]
          DOCKERFILE
      - name: Run the upstream soundcard tests without devices or network
        run: |
          set -euo pipefail
          docker run --rm --read-only --network none --cap-drop ALL --user 65534:65534 \
            --security-opt no-new-privileges graywolf-audio-tests \
            'audio::soundcard::tests::' --test-threads=1 | tee "$RUNNER_TEMP/audio-tests.log"
          for name in stream_error_policy_tolerates_isolated_xruns stream_error_policy_escalates_xrun_burst \
            stream_error_policy_non_xrun_is_always_fatal alsa_alias_matches_canonicalizes_shorthand \
            output_state_survives_rebuild_sharing_receiver; do
            grep -Fx "test audio::soundcard::tests::$name ... ok" "$RUNNER_TEMP/audio-tests.log"
          done

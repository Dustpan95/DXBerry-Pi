name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real station config in the tree
        run: '! git ls-files | grep -qxE "boot/dxberry\.txt|boot/dietpi-wifi\.txt"'
      - name: No attribution lines committed
        run: |
          if git grep -qIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . ; then
            echo "attribution text found in a tracked file:" >&2
            git grep -nIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . >&2
            exit 1
          fi
      - name: Syntax
        run: |
          for f in $(grep -lE '^#!/bin/(ba)?sh' provision/bin/*) provision/lib/*.sh provision/lib/apps/*.sh build/*.sh boot/*.sh tests/*.sh tests/fixtures/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x $(grep -lE '^#!/bin/(ba)?sh' provision/bin/*) provision/lib/*.sh provision/lib/apps/*.sh build/build-image.sh build/make-update-tarball.sh boot/*.sh tests/*.sh tests/fixtures/*.sh
      - name: Placeholder station binary
        # The update file and the tree check require provision/bin/dxberryd; the real one is built
        # by the binary-arm64 job, so this job uses an empty file (git-ignored).
        run: touch provision/bin/dxberryd
      - name: Unit tests
        run: tests/run.sh
      - name: Build tree check
        run: |
          build/build-image.sh --check
          rm -f provision/bin/dxberryd
  station:
    runs-on: ubuntu-latest
    env:
      # hraban/opus without its libopusfile part, as station/build.sh builds it (go vet,
      # staticcheck and go test read GOFLAGS)
      GOFLAGS: -tags=nolibopusfile
    defaults:
      run:
        working-directory: station
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopus-dev pkg-config
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest && "$(go env GOPATH)/bin/staticcheck" ./...
      - name: go test
        run: go test -race ./...
  binary-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      GOFLAGS: -tags=nolibopusfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopus-dev pkg-config
      - name: go vet
        run: cd station && go vet ./...
      - name: go test
        run: cd station && go test -race ./...
      - name: Build dxberryd
        run: bash station/build.sh out/dxberryd
      - name: Show the binary
        # the Pi installs libopus0 only: a binary that needs libopusfile would not start there
        run: |
          file station/out/dxberryd
          libs=$(ldd station/out/dxberryd)
          echo "$libs"
          ! grep -q libopusfile <<< "$libs"
      - uses: actions/upload-artifact@v4
        with:
          name: dxberryd-arm64
          path: station/out/dxberryd
          if-no-files-found: error
          retention-days: 7

name: Release image
on:
  push:
    branches: ['release/v0.5.0']
env:
  RELEASE_TAG: v0.5.0
  RELEASE_COMMIT: 2fb250d8099986a2e507b52b3cd14bbfb5e21ee5
permissions:
  contents: write
jobs:
  binary:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      # hraban/opus without its libopusfile part, as station/build.sh builds it
      GOFLAGS: -tags=nolibopusfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopus-dev pkg-config
      - name: go vet
        run: cd station && go vet ./...
      - name: go test
        run: cd station && go test -race ./...
      - name: Build dxberryd
        run: bash station/build.sh out/dxberryd "${RELEASE_TAG#v}"
      - name: Cross-user WSJT-X settings bridge
        run: tests/integration/test-wsjtx-settings-bridge.sh
      - name: Prepare preset HTTP test images
        run: docker pull golang:1.24.4-bookworm && docker pull debian:trixie-slim
      - name: Prepare program generation runtime
        run: docker build -t dxberry-program-state-runtime:fixture -f tests/integration/Dockerfile tests/integration
      - name: Program generation helper process boundary
        run: DXB_PROGRAMSTATE_GOPATH="$(go env GOPATH)" tests/integration/test-program-state-cli.sh station/out/dxberry-program-state "$RUNNER_TEMP/program-state-cli"
      - name: Preset configuration HTTP and actual helper
        run: DXB_PRESET_GOPATH="$(go env GOPATH)" tests/integration/test-preset-http.sh station/out/dxberry-preset "$RUNNER_TEMP/preset-http"
      - name: Preset preview with root-owned isolated fixtures
        run: DXB_PRESET_GOPATH="$(go env GOPATH)" tests/integration/test-preset-preview.sh "$RUNNER_TEMP/preset-preview"
      - name: Show the binary
        # the Pi installs libopus0 only: a binary that needs libopusfile would not start there
        run: |
          file station/out/dxberryd
          file station/out/dxberry-wsjtx-settings
          file station/out/dxberry-preset
          file station/out/dxberry-program-state
          test "$(station/out/dxberryd -wsjtx-protocol)" = "$(cat provision/share/wsjtx-native-protocol)"
          libs=$(ldd station/out/dxberryd)
          echo "$libs"
          ! grep -q libopusfile <<< "$libs"
      - name: Build the native XARA kit for VarAC
        run: |
          sudo apt-get install -y libasound2-dev libpulse-dev
          build/build-xara-kit.sh provision/share/xara.zip
      - uses: actions/upload-artifact@v4
        with:
          name: xara-arm64
          path: provision/share/xara.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: dxberryd-arm64
          path: |
            station/out/dxberryd
            station/out/dxberry-wsjtx-settings
            station/out/dxberry-preset
            station/out/dxberry-program-state
          if-no-files-found: error
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Build disposable root-fixture runner
        run: docker build -t dxberry-shell-ci -f tests/integration/Dockerfile.shell .
      - name: Syntax, lint, root fixtures and packaging checks
        run: docker run --rm --network none -v "$PWD:/source:ro" dxberry-shell-ci
  build:
    needs: [binary, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: actions/download-artifact@v4
        with:
          name: dxberryd-arm64
          path: dl
      - uses: actions/download-artifact@v4
        with:
          name: xara-arm64
          path: provision/share
      - name: Place the station binary
        run: |
          install -m 755 dl/dxberryd provision/bin/dxberryd
          install -m 755 dl/dxberry-wsjtx-settings provision/bin/dxberry-wsjtx-settings
          install -m 755 dl/dxberry-preset provision/bin/dxberry-preset
          install -m 755 dl/dxberry-program-state provision/bin/dxberry-program-state
          file provision/bin/dxberryd
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y parted
      - name: DXBerry update file
        run: build/make-update-tarball.sh "${RELEASE_TAG#v}" out
      - name: Build image
        run: sudo build/build-image.sh --version "${RELEASE_TAG#v}"
      - name: Release notes
        run: |
          {
            echo "Flash \`DXBerry-Pi-${RELEASE_TAG#v}-rpi234-arm64.img.xz\`, rename \`dxberry.txt.example\` to \`dxberry.txt\` on the boot partition, fill it in, boot."
            echo
            echo "## Highlights"
            echo "- Redesigned station console with an offline locator map and live program previews."
            echo "- Native ARM64 XARA kit with the VarAC 17 modem version reply and a receive-only integration."
            echo "- FT-991 USB power controls, HF APRS, and expanded WSJT-X status and radio controls."
            echo "- See the [full changes since v0.2.1](https://github.com/Dustpan95/DXBerry-Pi/compare/v0.2.1...v0.5.0)."
            echo
            echo "DietPi base image: $(cat build/work/*.img.xz.sha256)"
            echo "Graywolf: latest release at first boot (pin with GRAYWOLF_VERSION=)."
            echo "Console: https://<the Pi's address>/ (log in as dietpi with PASSWORD)."
            echo "Update from the console: Updates card, or sudo dxberry-update dxberry (dxberry-pi-${RELEASE_TAG#v}.tar.gz)."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the tag means a pre-release suffix (v0.1.0-rc1); plain vX.Y.Z is final.
          flags=()
          case "$RELEASE_TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --latest out/*.img.xz out/*.tar.gz out/*.sha256 \
            --title "DXBerry-Pi $RELEASE_TAG" --notes-file notes.md "${flags[@]}"

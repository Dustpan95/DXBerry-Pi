name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  binary:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: station/go.mod
      - name: PAM headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: go vet
        run: cd station && go vet ./...
      - name: go test
        run: cd station && go test -race ./...
      - name: Build dxberryd
        run: bash station/build.sh out/dxberryd
      - name: Show the binary
        run: file station/out/dxberryd
      - uses: actions/upload-artifact@v4
        with:
          name: dxberryd-arm64
          path: station/out/dxberryd
          if-no-files-found: error
  build:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dxberryd-arm64
          path: dl
      - name: Place the station binary
        run: |
          install -m 755 dl/dxberryd provision/bin/dxberryd
          file provision/bin/dxberryd
      - name: No real station config in the tree
        run: '! git ls-files | grep -qxE "boot/dxberry\.txt|boot/dietpi-wifi\.txt"'
      - name: No attribution lines committed
        run: |
          if git grep -qIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . ; then
            echo "attribution text found in a tracked file:" >&2
            git grep -nIiE 'co-?auth[o]red-?by|cla[u]de|anthr[o]pic' -- . >&2
            exit 1
          fi
      - name: Syntax
        run: |
          for f in $(grep -lE '^#!/bin/(ba)?sh' provision/bin/*) provision/lib/*.sh provision/lib/apps/*.sh build/*.sh boot/*.sh tests/*.sh tests/fixtures/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x $(grep -lE '^#!/bin/(ba)?sh' provision/bin/*) provision/lib/*.sh provision/lib/apps/*.sh build/build-image.sh build/make-update-tarball.sh boot/*.sh tests/*.sh tests/fixtures/*.sh
      - name: Unit tests
        run: tests/run.sh
      - name: Build tree check
        run: build/build-image.sh --check
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y parted
      - name: DXBerry update file
        run: build/make-update-tarball.sh "${GITHUB_REF_NAME#v}" out
      - name: Build image
        run: sudo build/build-image.sh --version "${GITHUB_REF_NAME#v}"
      - name: Release notes
        run: |
          {
            echo "Flash \`DXBerry-Pi-${GITHUB_REF_NAME#v}-rpi234-arm64.img.xz\`, rename \`dxberry.txt.example\` to \`dxberry.txt\` on the boot partition, fill it in, boot."
            echo
            echo "DietPi base image: $(cat build/work/*.img.xz.sha256)"
            echo "Graywolf: latest release at first boot (pin with GRAYWOLF_VERSION=)."
            echo "Console: https://<the Pi's address>/ (log in as dietpi with PASSWORD)."
            echo "Update from the console: Updates card, or sudo dxberry-update dxberry (dxberry-pi-${GITHUB_REF_NAME#v}.tar.gz)."
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen in the tag means a pre-release suffix (v0.1.0-rc1); plain vX.Y.Z is final.
          flags=()
          case "$GITHUB_REF_NAME" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" out/*.img.xz out/*.tar.gz out/*.sha256 \
            --title "DXBerry-Pi $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

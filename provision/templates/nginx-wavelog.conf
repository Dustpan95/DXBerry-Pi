# DXBerry: Wavelog, the logbook on this Pi (applications spec, ruling 10), on the station
# certificate at https://<pi>:8082/ for the LAN, and plain http://127.0.0.1:8083/ for this Pi's
# own programs only (the logging bridge). Wavelog has its own login and its API must answer
# without a station session cookie, so the console's login (the same session check as Pat's proxy) guards
# only the installer (/install: it creates the first user) and the backups Wavelog writes
# (/backup/: its notes backup page links the file there).
# Built from Wavelog's own nginx example, wavelog/wavelog_docs commit 2b501de (2026-10-16),
# docs/admin-guide/configuration/webserver.md "Nginx": the index.php fallback for / and /tiles/,
# PHP for every path with .php in it ("\.php(/|$)", not "\.php$": Wavelog's URLs are
# index.php/controller/...; also docs/getting-started/installation/linux.md "nginx
# configuration"), hidden files and application/ denied. Beyond the example, from Wavelog 3.2.4's
# own tree (tag 3.2.4): system/, src/, docker/, updates/ and uploads/ (ADIF imports) are denied
# as well, and no PHP runs from the directories that hold written or uploaded files. PHP goes
# through Debian's snippets/fastcgi-php.conf (PATH_INFO) to php-fpm's own socket.
server {
    listen 8082 ssl;
    listen 127.0.0.1:8083;
    ssl_certificate "@CERT@";
    ssl_certificate_key "@KEY@";
    root "@ROOT@";
    index index.php index.html;
    server_tokens off;
    # an ADIF import can be large
    client_max_body_size 32m;
    include snippets/dxberry-auth-endpoints.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /tiles/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # the installer makes the first user: a console login only
    location ^~ /install {
        include snippets/dxberry-auth-gate.conf;
        location ~ /\. { deny all; }
        location ~ \.php(/|$) {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }
    # the backups Wavelog writes: a console login only, and nothing runs there
    location ^~ /backup/ {
        include snippets/dxberry-auth-gate.conf;
        location ~ \.php { deny all; }
    }
    location ~ /\. { deny all; }
    location ~ ^/(application|system|src|docker|updates|uploads)(/|$) { deny all; }
    location ~ ^/(userdata|images|assets)/.*\.php { deny all; }
    location ~ ^/(update_wavelog\.sh|po_gen\.sh|Dockerfile|htaccess\.sample|VERSION)$ { deny all; }
    # Cloudlog-style detection asks api/auth/<key>: the key is in the URL, so it is not logged
    location ~ ^/index\.php/api/auth/ {
        access_log off;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location = /favicon.ico { log_not_found off; }
    location = /robots.txt { log_not_found off; }
    location ~ \.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

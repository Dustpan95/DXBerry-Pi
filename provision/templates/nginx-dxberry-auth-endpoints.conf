# DXBerry: what the gate asks (the station app, with only the browser's cookie) and where a refused request goes (server level)
location = /.dxberry-auth {
    internal;
    proxy_pass http://127.0.0.1:8090/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade "";
    proxy_set_header Host $host;
}
# the login page lives on the standard port, so a refused request on Pat's or Wavelog's own port
# goes to $host without that port
location @dxberry-login { return 302 https://$host/login?next=$request_uri; }

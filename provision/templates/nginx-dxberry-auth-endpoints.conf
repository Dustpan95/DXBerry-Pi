# DXBerry: what the gate asks (Cockpit, with only the browser's cookie) and where a refused request goes (server level)
location = /.dxberry-auth {
    internal;
    proxy_pass https://127.0.0.1:443/cockpit/login;
    proxy_ssl_verify off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade "";
    proxy_set_header Host $host;
}
location @dxberry-login { return 302 https://$host/; }

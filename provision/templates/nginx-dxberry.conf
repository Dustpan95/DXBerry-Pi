# DXBerry: the station app. nginx is the one TLS front on 443; port 80 only redirects to it.
# The certificate is the app's own (made by dxberryd on first start). This file sits in
# sites-enabled, inside nginx's http context, so the map below is valid here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 443 ssl default_server;
    listen 80 default_server;
    server_name _;
    ssl_certificate "@CERT@";
    ssl_certificate_key "@KEY@";
    server_tokens off;
    if ($scheme = http) { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }
}
